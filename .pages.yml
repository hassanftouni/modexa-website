# Pages CMS configuration for the Modexa website.
#
# Connect this repository to https://pagescms.org (log in with GitHub) and
# Pages CMS reads this file to provide the editing interface. Every save
# commits to GitHub, which triggers a Vercel rebuild — the team never needs
# to touch React or TypeScript code.
#
# Text fields come in pairs: English and Arabic (العربية). If an Arabic
# field is left empty, the website shows the English text instead.
#
# Field definitions mirror the JSON files in content/ and the types in
# src/content/schema.ts and src/content/pages.ts — keep all three in sync
# when adding a field.

media:
  input: public/images
